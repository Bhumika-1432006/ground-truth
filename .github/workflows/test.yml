name: test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest==8.3.3 ruff==0.6.9 cfn-lint==1.15.2
      - run: ruff check src tests video
      - run: cfn-lint template.yaml
      - run: pytest -q tests
